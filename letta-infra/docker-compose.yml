services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: letta-postgres
    environment:
      # WARNING: Change these credentials for production use
      POSTGRES_USER: letta
      POSTGRES_PASSWORD: letta
      POSTGRES_DB: letta
    volumes:
      # Persistent storage for database (survives container restarts)
      - postgres_data:/var/lib/postgresql/data
      # Initialize pgvector extension on first startup
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      # Expose PostgreSQL for direct database access
      # Change to "5433:5432" if port 5432 is already in use
      - "5432:5432"
    healthcheck:
      # Ensures database is ready before starting Letta server
      test: ["CMD-SHELL", "pg_isready -U letta"]
      interval: 10s
      timeout: 5s
      retries: 3

  letta:
    build:
      context: ..
      dockerfile: letta-infra/Dockerfile.dev
    container_name: letta-server
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # Load API keys and configuration from .env file
      - .env
    environment:
      # Database connection (automatically configured)
      # Update if you changed POSTGRES_USER or POSTGRES_PASSWORD above
      LETTA_PG_URI: postgresql://letta:letta@postgres:5432/letta
    volumes:
      # Mount source code for live editing (changes reflected immediately)
      # Only letta/ subdirectory is mounted; infrastructure changes require rebuild
      - ../letta:/app/letta
    ports:
      # Expose Letta API server
      # Change to "8284:8283" if port 8283 is already in use
      - "0.0.0.0:8283:8283"

  ade:
    build:
      context: .
      dockerfile: Dockerfile.ade
    container_name: letta-ade
    depends_on:
      - letta
    environment:
      # Point ADE to the Letta API server
      LETTA_API_URL: http://letta:8283
      # Allow connections from any host (for remote access)
      VITE_API_URL: http://localhost:8283
    ports:
      # Expose ADE web interface
      # Access at http://localhost:3000 or http://<server-ip>:3000
      - "0.0.0.0:3000:3000"

volumes:
  # Named volume for PostgreSQL data persistence
  # To delete all data: docker-compose down -v
  postgres_data:
